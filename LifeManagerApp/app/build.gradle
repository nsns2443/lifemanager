plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azharul.lifemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.azharul.lifemanager"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // সব বিল্ডে একই চাবি (keystore) ব্যবহার হয়, তাই নতুন APK পুরোনোটার ওপর আপডেট হিসেবে বসে
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
